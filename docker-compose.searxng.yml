name: ai-course-studio-web-rag

services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://127.0.0.1:${SEARXNG_HOST_PORT:-8888}/
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-8888}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 1.5
    networks: [web_rag_net]

networks:
  web_rag_net:
    driver: bridge

volumes:
  searxng_cache:
